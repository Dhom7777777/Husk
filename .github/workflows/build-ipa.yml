name: Build IPA (iOS 15+)

on:
  workflow_dispatch:
  push:
    branches: [main, ios15]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XC="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install build tools
        run: |
          brew install meson ninja pkg-config xcodegen qemu cmake autoconf automake libtool gettext
          python3 -m pip install --break-system-packages pyyaml mako packaging setuptools tomli
          rustup target add aarch64-apple-ios

      # The dependency builds (QEMU, ANGLE, MoltenVK ...) take over an hour. They are cached even when a later
      # step fails, so a re-run after fixing an app compile error does not start from zero.
      - name: Restore dependency cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            third_party
            build
            guests
          key: husk-deps-${{ hashFiles('scripts/*.sh', 'src/ios-jit/**', 'src/art-support/**') }}
          restore-keys: husk-deps-

      - name: Build everything and package the IPA
        run: |
          mkdir -p build
          set -o pipefail
          ./scripts/ci_build.sh "$PWD/build/Husk.ipa" 2>&1 | tee build/ci.log

      # Put the tail of the failing log into the run's annotations, so the error is readable without downloading.
      - name: Report failure
        if: failure()
        run: |
          for f in build/ci.log $(ls -t build/logs/* 2>/dev/null | head -1) /tmp/husk_ipa/build.log; do
            [ -f "$f" ] || continue
            msg="$(grep -E ' error: |FAIL|fatal|No such' "$f" | sed 's#.*/Husk/##' | sort -u | head -25 | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            echo "::error title=$f::$msg"
            tail=$(tail -15 "$f" | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=tail of $f::$tail"
          done

      - name: Save dependency cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            third_party
            build
            guests
          key: husk-deps-${{ hashFiles('scripts/*.sh', 'src/ios-jit/**', 'src/art-support/**') }}

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Husk-ipa
          path: |
            build/Husk.ipa
            build/Husk.tipa
          if-no-files-found: error

      - name: Upload logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/logs
            /tmp/husk_ipa/build.log
          if-no-files-found: ignore
